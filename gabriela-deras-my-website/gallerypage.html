<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Gaby's Car Wash | Gallery & Location</title>
     <!-- Connect CSS -->
    <link rel="stylesheet" href="stylesheet.css">

    <!-- Connect JavaScript -->
    <script src="interaction.js" defer></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    
  <!-- HEADER: LOGO AND BUSINESS NAME -->
<header class="header">

    <div class="water-effects">
        <span class="bubble bubble1"></span>
        <span class="bubble bubble2"></span>
        <span class="bubble bubble3"></span>
        <span class="bubble bubble4"></span>
        <span class="bubble bubble5"></span>
        <span class="bubble bubble6"></span>
        <span class="bubble bubble7"></span>
        <span class="bubble bubble8"></span>
    </div>

    <img src="logo.png" alt="Gaby's Car Wash">

</header>



<!-- NAVIGATION MENU -->
<nav class="navigation">
    <a href="index.html">Home</a>
    <a href="servicespage.html">Services</a>
    <a href="gallerypage.html">Gallery</a>
    <a href="gallerypage.html#location">Location</a>
</nav>


    <main>

        <!-- Gallery Section -->
        <section class="gallery-section">

            <h1>✧ A Glimpse of the Shine ✧</h1>

            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="photo 1.jpg"
                         alt="A car being washed at Gaby's Car Wash">
                </div>

                <div class="gallery-item">
                    <img src="photo 2.jpg"
                         alt="a person cleaning steering wheel">
                </div>

                <div class="gallery-item">
                    <img src="photo 3.jpg"
                         alt="extra maintenance for a car">
                </div>

                <div class="gallery-item">
                    <img src="photo 4.jpg"
                         alt="car going through a car wash tunnel">
                </div>

                <div class="gallery-item">
                    <img src="photo 5.jpg"
                         alt="polishing headlights of a car">
                </div>

                
                <div class="gallery-item">
                    <img src="photo 6.jpg"
                         alt="A freshly cleaned car">
                </div>

            </div> <!-- CLOSES gallery-grid -->

        </section> <!-- CLOSES gallery-section -->


        <!-- LIGHTBOX -->
        <div class="lightbox" id="galleryLightbox">
            <button class="lightbox-close" id="lightboxClose">&times;</button>
            <button class="lightbox-prev" id="lightboxPrev">&#10094;</button>

            <img id="lightboxImage" src="" alt="">

            <button class="lightbox-next" id="lightboxNext">&#10095;</button>

            <p class="lightbox-caption" id="lightboxCaption"></p>
        </div>


       
<!-- LOCATION SECTION -->
<section class="location-section" id="location">

  <h2>Come Visit Us!</h2>

<div class="location-divider">
    <span></span>
    <i class="fa-solid fa-droplet"></i>
    <span></span>
</div>
 

    <div class="location-content">

        <!-- LOCATION INFORMATION -->
        <div class="location-info">
            <h3>Find Us</h3>

            <div class="location-detail">
                <i class="fa-solid fa-location-dot"></i>
                <p>320 N La Brea Ave,<br>Inglewood, CA 90302</p>
            </div>

            <div class="location-detail">
                <i class="fa-solid fa-car"></i>
                <p>Conveniently located in Inglewood.</p>
            </div>

            <a class="directions-button"
               href="https://www.google.com/maps/search/?api=1&query=320+N+La+Brea+Ave+Inglewood+CA+90302"
               target="_blank">
                <i class="fa-solid fa-diamond-turn-right"></i>
                Get Directions
            </a>
        </div>

        <!-- GOOGLE MAP -->
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2374.0129083846828!2d-118.35686532596455!3d33.9676365221959!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c2b705ba2ed33b%3A0xd7f4a0a7fe8e82bf!2sLUV%20Car%20Wash%20-%20N%20La%20Brea%20Ave!5e1!3m2!1sen!2sus!4v1793302216908!5m2!1sen!2sus"
                allowfullscreen
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

    </div>
</section>


</main>


    <!-- FOOTER -->
<footer class="footer">

    <!-- CONTACT INFORMATION -->
    <div class="footer-contact">

        <h3>Contact us</h3>

        <a href="mailto:Gabrieladeras74@gmail.com">
            Email Us
        </a>

        <h3>Follow us</h3>

        <!-- SOCIAL ICONS -->
        <div class="social-links">

            <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

        </div>

    </div>

    <!-- EXTERNAL SUPPLIER LINK -->
    <div class="footer-supplier">

        <h3>Helpful Resources</h3>

        <a href="https://www.meguiars.com/" target="_blank">
            Visit Our Supplier!
        </a>

    </div>

    <!-- SMALL LOGO -->
    <div class="footer-logo">

        <img src="logo part 2.png"
             alt="Gaby's Car Wash small logo">

    </div>

</footer>
